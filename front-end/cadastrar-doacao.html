<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Cadastrar doação - DoaFácil</title>
</head>
<body>
    <header>
        <div class="container">
            <h1>Cadastrar Nova Doação</h1>
        </div>
    </header>

    <main class="container form-container">
        <h2>Cadastre sua doação</h2>
        <form action="confirmacao.html" method="POST">
            <div class="form-group">
                <label for="tipo-alimento">Tipo de alimento:</label>
                <input type="text" id="tipo-alimento" name="tipo-alimento" required>
            </div>
            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" name="quantidade" required>
            </div>
            <div class="form-group">
                <label for="local">Local da doação:</label>
                <input type="text" id="local" name="local" required>
            </div>
            <button type="submit" class="button">Cadastrar</button>
        </form>
        <div class="form-links">
            <p>Já tem uma conta? <a href="login.html">Faça login aqui</a></p>
        </div>
    </main>

    <footer>
        <p>Plataforma DoaFácil &copy; 2025</p>
    </footer>
</body>
</html>
